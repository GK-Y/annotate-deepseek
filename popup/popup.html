<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Annotate for DeepSeek</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="card">
      <header class="header">
        <img
          class="logo"
          src="../icons/icon-48.png"
          width="40"
          height="40"
          alt=""
        />
        <div>
          <h1>Annotate for DeepSeek</h1>
          <p class="tagline">Highlight → Ask DeepSeek</p>
        </div>
      </header>

      <ol class="steps">
        <li>
          Open
          <a href="https://chat.deepseek.com" target="_blank" rel="noreferrer"
            >chat.deepseek.com</a
          >.
        </li>
        <li>Highlight text in a message.</li>
        <li>Click <strong>Ask DeepSeek</strong>.</li>
      </ol>

      <p class="note">
        The text lands in the prompt box. Nothing is sent automatically.
      </p>
    </main>
  </body>
</html>
